<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>새숨더함 — 관리자 페이지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <style>
    /* ── 변수 ── */
    :root {
      --blue:      #0091EA;
      --blue-dark: #005FAD;
      --blue-soft: #E6F3FB;
      --charcoal:  #2c2b28;
      --gray:      #b0aca3;
      --mid-gray:  #e8e6e1;
      --light:     #f4f3f0;
      --white:     #ffffff;
      --red:       #e53935;
      --green:     #43a047;
      --orange:    #fb8c00;
      --radius:    10px;
      --shadow:    0 4px 20px rgba(0,0,0,0.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--light);
      color: var(--charcoal);
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ══ 로그인 화면 ══ */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1f2e 0%, #0f1a2e 100%);
      padding: 1.5rem;
    }
    .login-box {
      background: var(--white);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    .login-logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--blue);
      margin-bottom: 0.25rem;
    }
    .login-sub {
      font-size: 0.78rem;
      color: var(--gray);
      letter-spacing: 0.08em;
      margin-bottom: 2rem;
    }
    .login-box h1 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--charcoal);
    }
    .login-input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1.5px solid var(--mid-gray);
      border-radius: var(--radius);
      font-size: 1.1rem;
      font-family: inherit;
      text-align: center;
      letter-spacing: 0.3em;
      outline: none;
      margin-bottom: 0.75rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .login-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(0,145,234,0.12);
    }
    .login-btn {
      width: 100%;
      padding: 0.875rem;
      background: var(--blue);
      color: var(--white);
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }
    .login-btn:hover { background: var(--blue-dark); }
    .login-error {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--red);
      min-height: 1.2em;
    }
    .login-notice {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--gray);
      line-height: 1.6;
      padding: 0.75rem;
      background: var(--light);
      border-radius: 8px;
    }

    /* ══ 관리자 대시보드 ══ */
    #adminScreen { display: none; }

    /* 헤더 */
    .admin-header {
      background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 100%);
      color: var(--white);
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .admin-header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .admin-header-logo { font-size: 1.05rem; font-weight: 700; }
    .admin-header-tag {
      font-size: 0.7rem;
      background: rgba(255,255,255,0.18);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      letter-spacing: 0.05em;
    }
    .admin-logout-btn {
      background: rgba(255,255,255,0.18);
      border: none;
      color: var(--white);
      padding: 0.4rem 0.875rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .admin-logout-btn:hover { background: rgba(255,255,255,0.3); }

    /* 본문 */
    .admin-body {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    /* 탭 필터 */
    .admin-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .admin-tab {
      padding: 0.5rem 1.1rem;
      border: 1.5px solid var(--mid-gray);
      border-radius: 20px;
      background: var(--white);
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 600;
      color: var(--gray);
      cursor: pointer;
      transition: all 0.2s;
    }
    .admin-tab.active {
      background: var(--blue);
      border-color: var(--blue);
      color: var(--white);
    }
    .admin-tab:hover:not(.active) {
      border-color: var(--blue);
      color: var(--blue);
    }

    /* 통계 카드 */
    .admin-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-box {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .stat-box .num {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 0.3rem;
    }
    .stat-box .lbl {
      font-size: 0.8rem;
      color: var(--gray);
    }
    .stat-total   .num { color: var(--blue); }
    .stat-pending .num { color: var(--orange); }
    .stat-approved .num { color: var(--green); }

    /* 로딩/빈 상태 */
    .admin-loading,
    .admin-empty {
      text-align: center;
      padding: 3rem;
      color: var(--gray);
      font-size: 0.95rem;
    }
    .admin-spinner {
      display: inline-block;
      width: 32px; height: 32px;
      border: 3px solid var(--mid-gray);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 후기 카드 */
    .review-list { display: flex; flex-direction: column; gap: 1rem; }

    .rv-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--mid-gray);
      transition: border-color 0.2s;
    }
    .rv-card.pending  { border-left-color: var(--orange); }
    .rv-card.approved { border-left-color: var(--green); }

    .rv-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.875rem;
      flex-wrap: wrap;
    }
    .rv-meta { display: flex; flex-direction: column; gap: 0.25rem; }
    .rv-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--charcoal);
    }
    .rv-info {
      font-size: 0.8rem;
      color: var(--gray);
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .rv-info span { display: flex; align-items: center; gap: 0.25rem; }
    .rv-stars { color: #f5a623; font-size: 0.95rem; letter-spacing: 0.05em; }

    .rv-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .rv-badge.pending  { background: #fff3e0; color: var(--orange); }
    .rv-badge.approved { background: #e8f5e9; color: var(--green); }

    .rv-content {
      font-size: 0.9rem;
      line-height: 1.75;
      color: var(--charcoal);
      background: var(--light);
      border-radius: 8px;
      padding: 0.875rem 1rem;
      margin-bottom: 0.875rem;
    }

    .rv-phone {
      font-size: 0.78rem;
      color: var(--gray);
      margin-bottom: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .rv-phone strong { color: var(--charcoal); }

    .rv-date {
      font-size: 0.75rem;
      color: var(--gray);
    }

    .rv-actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--mid-gray);
    }

    /* 버튼 */
    .btn-approve, .btn-unapprove, .btn-delete {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-approve {
      background: var(--green);
      color: var(--white);
    }
    .btn-approve:hover { background: #388e3c; }
    .btn-unapprove {
      background: var(--orange);
      color: var(--white);
    }
    .btn-unapprove:hover { background: #f57c00; }
    .btn-delete {
      background: var(--red);
      color: var(--white);
      margin-left: auto;
    }
    .btn-delete:hover { background: #c62828; }

    /* 관리자 메모 */
    .rv-note-wrap {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex: 1;
    }
    .rv-note-input {
      flex: 1;
      padding: 0.45rem 0.75rem;
      border: 1.5px solid var(--mid-gray);
      border-radius: 6px;
      font-size: 0.82rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .rv-note-input:focus { border-color: var(--blue); }
    .btn-note {
      padding: 0.45rem 0.75rem;
      background: var(--blue-soft);
      color: var(--blue-dark);
      border: 1.5px solid rgba(0,145,234,0.25);
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .btn-note:hover { background: var(--blue); color: var(--white); }

    /* 토스트 알림 */
    #toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--charcoal);
      color: var(--white);
      padding: 0.875rem 1.5rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      z-index: 9999;
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { background: var(--green); }
    #toast.error   { background: var(--red); }

    /* 반응형 */
    @media (max-width: 600px) {
      .admin-header { padding: 0 1rem; }
      .admin-body { padding: 0 1rem; margin-top: 1.25rem; }
      .admin-stats { grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
      .stat-box { padding: 0.875rem 0.75rem; }
      .stat-box .num { font-size: 1.5rem; }
      .rv-card-top { flex-direction: column; }
      .btn-delete { margin-left: 0; }
    }
  </style>
</head>
<body>

<!-- ══ 로그인 화면 ══ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">새숨더함</div>
    <div class="login-sub">SAESUM DEOHAM</div>
    <h1>관리자 로그인</h1>
    <input
      type="password"
      id="pwInput"
      class="login-input"
      placeholder="비밀번호"
      maxlength="20"
      autocomplete="current-password"
    />
    <button class="login-btn" id="loginBtn">
      <i class="fa fa-lock"></i> 로그인
    </button>
    <p class="login-error" id="loginError"></p>
    <p class="login-notice">
      ⚠️ 이 페이지는 관리자 전용입니다.<br>
      비밀번호는 소스코드 보안 특성상 완벽한 보안을 보장하지 않습니다.<br>
      URL을 외부에 공유하지 마세요.
    </p>
  </div>
</div>

<!-- ══ 관리자 대시보드 ══ -->
<div id="adminScreen">

  <!-- 헤더 -->
  <header class="admin-header">
    <div class="admin-header-left">
      <span class="admin-header-logo">🌿 새숨더함</span>
      <span class="admin-header-tag">관리자</span>
    </div>
    <div style="display:flex;align-items:center;gap:1rem;">
      <a href="index.html" style="color:rgba(255,255,255,0.75);font-size:0.82rem;">
        <i class="fa fa-external-link-alt"></i> 홈페이지 보기
      </a>
      <button class="admin-logout-btn" id="logoutBtn">
        <i class="fa fa-sign-out-alt"></i> 로그아웃
      </button>
    </div>
  </header>

  <!-- 본문 -->
  <div class="admin-body">

    <!-- 통계 -->
    <div class="admin-stats">
      <div class="stat-box stat-total">
        <div class="num" id="statTotal">—</div>
        <div class="lbl">전체 후기</div>
      </div>
      <div class="stat-box stat-pending">
        <div class="num" id="statPending">—</div>
        <div class="lbl">승인 대기</div>
      </div>
      <div class="stat-box stat-approved">
        <div class="num" id="statApproved">—</div>
        <div class="lbl">게시 중</div>
      </div>
    </div>

    <!-- 탭 필터 -->
    <div class="admin-tabs">
      <button class="admin-tab active" data-filter="all">전체</button>
      <button class="admin-tab" data-filter="pending">⏳ 승인 대기</button>
      <button class="admin-tab" data-filter="approved">✅ 게시 중</button>
    </div>

    <!-- 후기 목록 -->
    <div id="reviewList">
      <div class="admin-loading">
        <div class="admin-spinner"></div>
        <div>후기를 불러오는 중...</div>
      </div>
    </div>

  </div>
</div>

<!-- 토스트 -->
<div id="toast"></div>

<script>
'use strict';

/* ── 설정 ── */
const ADMIN_PW  = 'saesum2025!';   // ← 비밀번호 (필요 시 변경)
const SESSION_KEY = 'ss_admin_auth';

/* ── 로그인 상태 복원 ── */
if (sessionStorage.getItem(SESSION_KEY) === 'ok') showAdmin();

/* ── 로그인 처리 ── */
document.getElementById('loginBtn').addEventListener('click', tryLogin);
document.getElementById('pwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryLogin();
});

function tryLogin() {
  const pw  = document.getElementById('pwInput').value;
  const err = document.getElementById('loginError');
  if (pw === ADMIN_PW) {
    sessionStorage.setItem(SESSION_KEY, 'ok');
    showAdmin();
  } else {
    err.textContent = '비밀번호가 올바르지 않습니다.';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

function showAdmin() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminScreen').style.display = 'block';
  loadReviews();
}

/* ── 로그아웃 ── */
document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
});

/* ── 데이터 ── */
let allReviews = [];
let currentFilter = 'all';

async function loadReviews() {
  const listEl = document.getElementById('reviewList');
  listEl.innerHTML = '<div class="admin-loading"><div class="admin-spinner"></div><div>후기를 불러오는 중...</div></div>';

  try {
    const res  = await fetch('tables/reviews?limit=500&sort=created_at');
    const data = await res.json();
    allReviews = (data.data || []).sort((a, b) => b.created_at - a.created_at);
    updateStats();
    renderList();
  } catch {
    listEl.innerHTML = '<div class="admin-empty">데이터를 불러오지 못했습니다.</div>';
  }
}

function updateStats() {
  const total    = allReviews.length;
  const approved = allReviews.filter(r => r.approved === true || r.approved === 'true' || r.approved === 1).length;
  const pending  = total - approved;
  document.getElementById('statTotal').textContent    = total;
  document.getElementById('statPending').textContent  = pending;
  document.getElementById('statApproved').textContent = approved;
}

/* ── 탭 필터 ── */
document.querySelectorAll('.admin-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  });
});

/* ── 목록 렌더링 ── */
function renderList() {
  const listEl = document.getElementById('reviewList');

  let rows = allReviews;
  if (currentFilter === 'pending') {
    rows = allReviews.filter(r => !(r.approved === true || r.approved === 'true' || r.approved === 1));
  } else if (currentFilter === 'approved') {
    rows = allReviews.filter(r => r.approved === true || r.approved === 'true' || r.approved === 1);
  }

  if (!rows.length) {
    listEl.innerHTML = '<div class="admin-empty">해당하는 후기가 없습니다.</div>';
    return;
  }

  const stars  = n => '★'.repeat(Number(n)) + '☆'.repeat(5 - Number(n));
  const fmtDate = ts => ts ? new Date(Number(ts)).toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';
  const isApproved = r => r.approved === true || r.approved === 'true' || r.approved === 1;

  listEl.innerHTML = '<div class="review-list">' + rows.map(r => {
    const approved = isApproved(r);
    const statusCls = approved ? 'approved' : 'pending';
    return `
    <div class="rv-card ${statusCls}" id="card-${r.id}">
      <div class="rv-card-top">
        <div class="rv-meta">
          <div class="rv-name">${esc(r.author_name)} 고객님</div>
          <div class="rv-info">
            <span><i class="fa fa-concierge-bell"></i> ${esc(r.service)}</span>
            <span><i class="fa fa-map-marker-alt"></i> ${esc(r.region)}</span>
          </div>
          <div class="rv-stars">${stars(r.rating)} <small style="color:#999;font-size:0.8rem;">(${r.rating}점)</small></div>
        </div>
        <span class="rv-badge ${statusCls}">
          ${approved ? '<i class="fa fa-check-circle"></i> 게시 중' : '<i class="fa fa-clock"></i> 승인 대기'}
        </span>
      </div>

      <div class="rv-content">${esc(r.content)}</div>

      <div class="rv-phone">
        <i class="fa fa-phone"></i>
        연락처 뒷자리: <strong>${esc(r.phone_last4)}</strong>
      </div>
      <div class="rv-date">
        <i class="fa fa-calendar-alt"></i> 작성일: ${fmtDate(r.created_at)}
      </div>

      <div class="rv-actions">
        ${approved
          ? `<button class="btn-unapprove" onclick="toggleApprove('${r.id}', false)"><i class="fa fa-eye-slash"></i> 게시 취소</button>`
          : `<button class="btn-approve"   onclick="toggleApprove('${r.id}', true)"><i class="fa fa-check"></i> 승인 게시</button>`
        }

        <div class="rv-note-wrap">
          <input type="text" class="rv-note-input" id="note-${r.id}" value="${esc(r.admin_note || '')}" placeholder="관리자 메모 (선택)" />
          <button class="btn-note" onclick="saveNote('${r.id}')"><i class="fa fa-save"></i> 저장</button>
        </div>

        <button class="btn-delete" onclick="deleteReview('${r.id}')"><i class="fa fa-trash"></i> 삭제</button>
      </div>
    </div>
    `;
  }).join('') + '</div>';
}

/* ── 승인/취소 ── */
async function toggleApprove(id, approve) {
  try {
    const res = await fetch(`tables/reviews/${id}`, {
      method:  'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ approved: approve })
    });
    if (!res.ok) throw new Error();

    const idx = allReviews.findIndex(r => r.id === id);
    if (idx !== -1) allReviews[idx].approved = approve;
    updateStats();
    renderList();
    showToast(approve ? '✅ 후기가 게시되었습니다.' : '⏸️ 게시가 취소되었습니다.', approve ? 'success' : '');
  } catch {
    showToast('⚠️ 처리 중 오류가 발생했습니다.', 'error');
  }
}

/* ── 삭제 ── */
async function deleteReview(id) {
  if (!confirm('이 후기를 완전히 삭제하시겠습니까?\n삭제된 데이터는 복구할 수 없습니다.')) return;
  try {
    const res = await fetch(`tables/reviews/${id}`, { method: 'DELETE' });
    if (!res.ok && res.status !== 204) throw new Error();

    allReviews = allReviews.filter(r => r.id !== id);
    updateStats();
    renderList();
    showToast('🗑️ 후기가 삭제되었습니다.', '');
  } catch {
    showToast('⚠️ 삭제 중 오류가 발생했습니다.', 'error');
  }
}

/* ── 관리자 메모 저장 ── */
async function saveNote(id) {
  const note = document.getElementById(`note-${id}`)?.value || '';
  try {
    const res = await fetch(`tables/reviews/${id}`, {
      method:  'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ admin_note: note })
    });
    if (!res.ok) throw new Error();

    const idx = allReviews.findIndex(r => r.id === id);
    if (idx !== -1) allReviews[idx].admin_note = note;
    showToast('📝 메모가 저장되었습니다.', 'success');
  } catch {
    showToast('⚠️ 저장 중 오류가 발생했습니다.', 'error');
  }
}

/* ── 토스트 ── */
let toastTimer = null;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'show ' + type;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}

/* ── HTML 이스케이프 ── */
function esc(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
